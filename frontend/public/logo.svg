<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563EB" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- House Geometric Icon in Blue -->
  <g transform="translate(15, 12)" filter="url(#subtleGlow)">
    <!-- Outer Roof & Wall outline -->
    <path d="M 55 10 L 10 50 L 10 105 L 100 105 L 100 50 Z" 
          fill="none" 
          stroke="url(#blueGradient)" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Chimney / Spark element -->
    <path d="M 75 30 L 75 18 L 86 18 L 86 40" 
          fill="none" 
          stroke="url(#blueGradient)" 
          stroke-width="6" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- AI Sparkle Star -->
    <path d="M 98 12 Q 98 22 108 22 Q 98 22 98 32 Q 98 22 88 22 Q 98 22 98 12 Z" 
          fill="#3B82F6"/>

    <!-- Inner Architectural Nesting Path -->
    <path d="M 55 35 L 28 58 L 28 92 L 82 92 L 82 58 Z" 
          fill="none" 
          stroke="#2563EB" 
          stroke-width="6" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Doorway Pillar -->
    <path d="M 45 92 L 45 70 L 65 70 L 65 92" 
          fill="none" 
          stroke="#1D4ED8" 
          stroke-width="6" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- Propert-E Typography in Deep Slate Navy -->
  <text x="145" y="86" 
        font-family="'Fraunces', 'Playfair Display', Georgia, serif" 
        font-size="62" 
        font-weight="800" 
        fill="#2563EB" 
        letter-spacing="-1">
    Propert-<tspan fill="#1D4ED8">E</tspan>
  </text>
</svg>
